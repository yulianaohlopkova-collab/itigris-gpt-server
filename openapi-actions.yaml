openapi: 3.1.0
info:
  title: ODL Sales Analyst Actions API (Clean)
  version: "1.0.0"
  description: >
    Clean OpenAPI schema for GPT Actions routing.
    This schema intentionally exposes ONLY the exact remainGoodsReport snapshot tools
    needed for accurate stock answers. Legacy/approximate tools (remoteRemains, remains-filtered,
    count-by-filters, etc.) are intentionally omitted so GPT cannot select them.

servers:
  - url: https://itigris-gpt-server.onrender.com

security:
  - OdlServerToken: []

paths:
  /product-search:
    get:
      operationId: productSearch
      summary: "PRIMARY: exact product search (remainGoodsReport snapshot)"
      description: >
        Use FIRST for detailed product stock questions (brand/model/design/product_name/SKU/etc).
        Source of truth: parsed remainGoodsReport snapshot.
        Use structured params (brand/design/model/product_name/manufacturer) and avoid using `query`
        unless the user request is vague free-text.
      parameters:
        - name: report_type
          in: query
          required: false
          schema:
            type: string
          description: 'ITigris "Тип товара" (e.g. Контактные линзы, Оправы, Линзы, Солнцезащитные очки, Аксессуары).'
        - name: department_name
          in: query
          required: false
          schema:
            type: string
          description: Department name (aliases allowed; server best-effort matches).
        - name: brand
          in: query
          required: false
          schema:
            type: string
        - name: manufacturer
          in: query
          required: false
          schema:
            type: string
        - name: product_name
          in: query
          required: false
          schema:
            type: string
        - name: model
          in: query
          required: false
          schema:
            type: string
        - name: design
          in: query
          required: false
          schema:
            type: string
        - name: target_group
          in: query
          required: false
          schema:
            type: string
          description: >
            Target group / purpose (e.g. Жен., Муж., Уни.). Works when the snapshot rows contain the column
            "Целевая группа" (mostly frames/sunglasses). If the field is unavailable for this report_type,
            results will be empty (server does not guess).
        - name: material
          in: query
          required: false
          schema:
            type: string
        - name: type
          in: query
          required: false
          schema:
            type: string
          description: Row-level type (e.g. Тип оправы / Тип линз / Тип линзы).
        - name: color
          in: query
          required: false
          schema:
            type: string
        - name: category
          in: query
          required: false
          schema:
            type: string
          description: Row-level category/type (NOT report_type).
        - name: query
          in: query
          required: false
          schema:
            type: string
          description: Free-text search across row fields. Use only when structured params are unclear.
        - name: include_rows
          in: query
          required: false
          schema:
            type: boolean
            default: false
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 50
            minimum: 1
            maximum: 2000
          description: >
            Limits only the returned `rows` when include_rows=true. Totals are always computed over ALL matched rows.
        - name: group_by
          in: query
          required: false
          schema:
            type: string
          description: >
            Optional breakdown group key. Common values: design, brand, material, target_group, type, color,
            manufacturer, model, product_name, department.
      responses:
        "200":
          description: Product search totals (and optional rows)
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  source:
                    type: string
                  report_type:
                    type: string
                  matched_department:
                    type: string
                    nullable: true
                  snapshot:
                    type: object
                    description: Proof block (what snapshot was used)
                    properties:
                      filename:
                        type: string
                        nullable: true
                      stored_at_unix:
                        type: integer
                        nullable: true
                      expires_at_unix:
                        type: integer
                        nullable: true
                      rows_count:
                        type: integer
                        nullable: true
                    additionalProperties: true
                  filters_used:
                    type: object
                    description: Proof block (what filters were applied)
                    properties: {}
                    additionalProperties: true
                  matched_rows_count:
                    type: integer
                  total_qty_units:
                    type: integer
                  total_qty_packs:
                    type: integer
                  total_value:
                    type: number
                  group_by:
                    type: string
                    nullable: true
                  breakdown:
                    type: array
                    nullable: true
                    items:
                      type: object
                      properties:
                        key:
                          type: string
                        matched_rows_count:
                          type: integer
                        total_qty_units:
                          type: integer
                        total_qty_packs:
                          type: integer
                        total_value:
                          type: number
                      additionalProperties: false
                  error:
                    type: string
                    nullable: true
                  rows:
                    type: array
                    items:
                      type: object
                      properties: {}
                      additionalProperties: true
                additionalProperties: false

  /low-stock-models:
    get:
      operationId: lowStockModels
      summary: "PRIMARY (lists): low-stock models/groups from remainGoodsReport snapshot"
      description: >
        Use this when the user asks for a LIST/export like "модели по 1 штуке", "что на исходе", "выгрузи позиции с остатком <=1".
        This endpoint groups snapshot rows and returns compact group results where total_qty_units <= threshold.
        It does not guess. It's based on the parsed remainGoodsReport snapshot.
      parameters:
        - name: report_type
          in: query
          required: false
          schema: { type: string }
        - name: department_name
          in: query
          required: false
          schema: { type: string }
        - name: brand
          in: query
          required: false
          schema: { type: string }
        - name: manufacturer
          in: query
          required: false
          schema: { type: string }
        - name: product_name
          in: query
          required: false
          schema: { type: string }
        - name: model
          in: query
          required: false
          schema: { type: string }
        - name: design
          in: query
          required: false
          schema: { type: string }
        - name: target_group
          in: query
          required: false
          schema: { type: string }
        - name: material
          in: query
          required: false
          schema: { type: string }
        - name: type
          in: query
          required: false
          schema: { type: string }
        - name: color
          in: query
          required: false
          schema: { type: string }
        - name: category
          in: query
          required: false
          schema: { type: string }
        - name: query
          in: query
          required: false
          schema: { type: string }
        - name: threshold
          in: query
          required: false
          schema:
            type: integer
            default: 1
            minimum: 0
          description: Return groups where total_qty_units <= threshold.
        - name: group_fields
          in: query
          required: false
          schema:
            type: string
            default: "department,brand,model,design,target_group"
          description: Comma-separated list of fields to group by.
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 500
            minimum: 1
            maximum: 5000
        - name: output
          in: query
          required: false
          schema:
            type: string
            default: json
            enum: [json, csv]
      responses:
        "200":
          description: Low-stock grouped list (JSON) or CSV stream (when output=csv)
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  source: { type: string }
                  report_type: { type: string }
                  matched_department: { type: string, nullable: true }
                  threshold: { type: integer }
                  group_fields:
                    type: array
                    items: { type: string }
                  groups_count: { type: integer }
                  snapshot:
                    type: object
                    properties:
                      filename: { type: string, nullable: true }
                      stored_at_unix: { type: integer, nullable: true }
                      expires_at_unix: { type: integer, nullable: true }
                      rows_count: { type: integer, nullable: true }
                    additionalProperties: true
                  filters_used:
                    type: object
                    properties: {}
                    additionalProperties: true
                  groups:
                    type: array
                    items:
                      type: object
                      properties: {}
                      additionalProperties: true
                additionalProperties: false

  /contactlenses/remainGoodsReport/auto/refresh:
    post:
      operationId: remainGoodsReportAutoRefresh
      summary: Refresh remainGoodsReport snapshot from ITigris
      description: >
        Best-effort refresh of snapshot. Use when the user asks to "update now" or if snapshot is missing/stale.
      parameters:
        - name: force
          in: query
          required: false
          schema:
            type: boolean
            default: false
        - name: report_type
          in: query
          required: false
          schema:
            type: string
          description: 'ITigris "Тип товара" (reportType).'
      responses:
        "200":
          description: Refresh status
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  error:
                    type: string
                    nullable: true
                  method:
                    type: string
                    nullable: true
                  build_commit:
                    type: string
                    nullable: true
                  report_type:
                    type: string
                    nullable: true
                  filename:
                    type: string
                    nullable: true
                  stored_at_unix:
                    type: integer
                    nullable: true
                  expires_at_unix:
                    type: integer
                    nullable: true
                  rows_count:
                    type: integer
                    nullable: true
                  departments_count:
                    type: integer
                    nullable: true
                  overall_summary:
                    type: object
                    nullable: true
                    properties: {}
                    additionalProperties: true
                additionalProperties: true

components:
  schemas: {}
  securitySchemes:
    OdlServerToken:
      type: apiKey
      in: header
      name: X-ODL-Token
