openapi: 3.1.0
info:
  title: ODL Sales Analyst Actions API (Clean)
  version: "1.0.0"
  description: >
    Clean OpenAPI schema for GPT Actions routing.
    This schema intentionally exposes ONLY the exact remainGoodsReport snapshot tools
    needed for accurate stock answers. Legacy/approximate tools (remoteRemains, remains-filtered,
    count-by-filters, etc.) are intentionally omitted so GPT cannot select them.

servers:
  - url: https://itigris-gpt-server.onrender.com

security:
  - OdlServerToken: []

paths:
  /product-search:
    get:
      operationId: productSearch
      summary: "PRIMARY: exact product search (remainGoodsReport snapshot)"
      description: >
        Use FIRST for detailed product stock questions (brand/model/design/product_name/SKU/etc).
        Source of truth: parsed remainGoodsReport snapshot.
        Use structured params (brand/design/model/product_name/manufacturer) and avoid using `query`
        unless the user request is vague free-text.
      parameters:
        - name: report_type
          in: query
          required: false
          schema:
            type: string
          description: 'ITigris "Тип товара" (e.g. Контактные линзы, Оправы, Линзы, Солнцезащитные очки, Аксессуары).'
        - name: department_name
          in: query
          required: false
          schema:
            type: string
          description: Department name (aliases allowed; server best-effort matches).
        - name: brand
          in: query
          required: false
          schema:
            type: string
        - name: manufacturer
          in: query
          required: false
          schema:
            type: string
        - name: product_name
          in: query
          required: false
          schema:
            type: string
        - name: model
          in: query
          required: false
          schema:
            type: string
        - name: design
          in: query
          required: false
          schema:
            type: string
        - name: category
          in: query
          required: false
          schema:
            type: string
          description: Row-level category/type (NOT report_type).
        - name: query
          in: query
          required: false
          schema:
            type: string
          description: Free-text search across row fields. Use only when structured params are unclear.
        - name: include_rows
          in: query
          required: false
          schema:
            type: boolean
            default: false
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 50
            minimum: 1
            maximum: 2000
      responses:
        "200":
          description: Product search totals (and optional rows)
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  source:
                    type: string
                  report_type:
                    type: string
                  matched_department:
                    type: string
                    nullable: true
                  matched_rows_count:
                    type: integer
                  total_qty_units:
                    type: integer
                  total_qty_packs:
                    type: integer
                  total_value:
                    type: number
                  error:
                    type: string
                    nullable: true
                  rows:
                    type: array
                    items:
                      type: object
                      properties: {}
                      additionalProperties: true
                additionalProperties: false

  /contactlenses/remainGoodsReport/auto/refresh:
    post:
      operationId: remainGoodsReportAutoRefresh
      summary: Refresh remainGoodsReport snapshot from ITigris
      description: >
        Best-effort refresh of snapshot. Use when the user asks to "update now" or if snapshot is missing/stale.
      parameters:
        - name: force
          in: query
          required: false
          schema:
            type: boolean
            default: false
        - name: report_type
          in: query
          required: false
          schema:
            type: string
          description: 'ITigris "Тип товара" (reportType).'
      responses:
        "200":
          description: Refresh status
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  error:
                    type: string
                    nullable: true
                  method:
                    type: string
                    nullable: true
                  build_commit:
                    type: string
                    nullable: true
                  report_type:
                    type: string
                    nullable: true
                  filename:
                    type: string
                    nullable: true
                  stored_at_unix:
                    type: integer
                    nullable: true
                  expires_at_unix:
                    type: integer
                    nullable: true
                  rows_count:
                    type: integer
                    nullable: true
                  departments_count:
                    type: integer
                    nullable: true
                  overall_summary:
                    type: object
                    nullable: true
                    properties: {}
                    additionalProperties: true
                additionalProperties: true

components:
  schemas: {}
  securitySchemes:
    OdlServerToken:
      type: apiKey
      in: header
      name: X-ODL-Token
