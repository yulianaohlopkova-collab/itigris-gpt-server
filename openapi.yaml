openapi: 3.1.0
info:
  title: ODL Sales Analyst MVP API
  version: "3.0.0"
  description: >
    MVP API для «Очкидалинзы»: ITigris remoteRemains используется только для
    остатков и товарной структуры, продажи анализируются из DataLens/Google
    Sheets/CSV input.
servers:
  - url: https://itigris-gpt-server.onrender.com

security:
  - OdlServerToken: []

paths:
  /healthz:
    get:
      operationId: healthCheck
      security: []
      summary: Проверить, что сервер жив
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object

  /departments:
    get:
      operationId: getDepartments
      summary: Список департаментов и алиасов
      responses:
        "200":
          description: Departments
          content:
            application/json:
              schema:
                type: object

  /categories:
    get:
      operationId: getCategories
      summary: Категории ITigris и допустимые фильтры
      responses:
        "200":
          description: Categories
          content:
            application/json:
              schema:
                type: object

  /remains-filtered:
    post:
      operationId: remainsFiltered
      summary: Остатки ITigris remoteRemains с фильтрами
      description: >
        Возвращает остатки, количество и стоимость. Это не продажи.
        Для МКЛ используйте category=contactlenses и фильтры manufacturer,
        name, color, radius, diameter, dioptre, cylinder, axis, add,
        wearingPeriod, inPack.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RemainsFilteredRequest"
      responses:
        "200":
          description: Remains summary
          content:
            application/json:
              schema:
                type: object
                description: >
                  Для category=contactlenses в summary дополнительно возвращаются:
                  total_qty_packs, total_qty_units и open_packs_detected.

  /count-by-filters:
    post:
      operationId: countByFilters
      summary: Посчитать остатки по категории, группе/салону и фильтрам
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RemainsFilteredRequest"
      responses:
        "200":
          description: Count summary
          content:
            application/json:
              schema:
                type: object

  /count-by-price/{category}:
    get:
      operationId: countByPrice
      summary: Посчитать остатки по ценовому диапазону
      parameters:
        - $ref: "#/components/parameters/CategoryPath"
        - $ref: "#/components/parameters/DepartmentId"
        - $ref: "#/components/parameters/DepartmentName"
        - $ref: "#/components/parameters/Group"
        - name: min_price
          in: query
          schema:
            type: number
        - name: max_price
          in: query
          schema:
            type: number
        - name: limit_items
          in: query
          schema:
            type: integer
            default: 50
            minimum: 0
            maximum: 500
      responses:
        "200":
          description: Count by price
          content:
            application/json:
              schema:
                type: object

  /count/{category}:
    get:
      operationId: countCategory
      summary: Посчитать все остатки категории
      parameters:
        - $ref: "#/components/parameters/CategoryPath"
        - $ref: "#/components/parameters/DepartmentId"
        - $ref: "#/components/parameters/DepartmentName"
        - $ref: "#/components/parameters/Group"
      responses:
        "200":
          description: Category count
          content:
            application/json:
              schema:
                type: object

  /breakdown/{category}:
    get:
      operationId: breakdownCategory
      summary: Структура остатков по полям категории
      parameters:
        - $ref: "#/components/parameters/CategoryPath"
        - $ref: "#/components/parameters/DepartmentId"
        - $ref: "#/components/parameters/DepartmentName"
        - $ref: "#/components/parameters/Group"
      responses:
        "200":
          description: Breakdown
          content:
            application/json:
              schema:
                type: object

  /gpt/breakdown/{category}:
    get:
      operationId: gptBreakdown
      summary: Компактная структура остатков для GPT Actions
      parameters:
        - $ref: "#/components/parameters/CategoryPath"
        - $ref: "#/components/parameters/DepartmentId"
        - $ref: "#/components/parameters/DepartmentName"
        - $ref: "#/components/parameters/Group"
        - name: top_n
          in: query
          schema:
            type: integer
            default: 10
            minimum: 1
            maximum: 30
      responses:
        "200":
          description: GPT compact breakdown
          content:
            application/json:
              schema:
                type: object

  /sales/analyze:
    post:
      operationId: salesAnalyze
      summary: Сформировать MVP weekly output по продажам
      description: >
        Принимает JSON dataset или использует data/input на сервере. Output
        возвращается в markdown с сигналами, проблемами, гипотезами и фокусом
        для Коммерческого директора и Тренеров.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                data:
                  type: object
                  additionalProperties:
                    type: array
                    items:
                      type: object
      responses:
        "200":
          description: Markdown report
          content:
            application/json:
              schema:
                type: object
                properties:
                  report_markdown:
                    type: string
                  data_sources:
                    type: object

  /sales/analyze-upload:
    post:
      operationId: salesAnalyzeUpload
      summary: Сформировать weekly output из CSV файлов (upload)
      description: >
        Загрузи sales_period.csv обязательно, остальные файлы опционально.
        Endpoint возвращает report_markdown (markdown) и счетчики строк по источникам.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [sales_period]
              properties:
                sales_period:
                  type: string
                  format: binary
                plan_fact:
                  type: string
                  format: binary
                employees:
                  type: string
                  format: binary
                categories:
                  type: string
                  format: binary
                training:
                  type: string
                  format: binary
      responses:
        "200":
          description: Markdown report
          content:
            application/json:
              schema:
                type: object
                properties:
                  report_markdown:
                    type: string
                  data_sources:
                    type: object

  /sales/analyze-csv:
    post:
      operationId: salesAnalyzeCsv
      summary: Сформировать weekly output из CSV текста (JSON)
      description: >
        Подходит для GPT Actions: передай содержимое CSV как строки в JSON.
        Обязателен только sales_period_csv, остальные поля опциональны.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SalesAnalyzeCsvRequest"
      responses:
        "200":
          description: Markdown report
          content:
            application/json:
              schema:
                type: object
                properties:
                  report_markdown:
                    type: string
                  data_sources:
                    type: object

  /contactlenses/remainGoodsReport/analyze:
    post:
      operationId: contactlensesRemainGoodsReportAnalyze
      summary: Точный остаток МКЛ из remainGoodsReport (CSV/XLSX upload)
      description: >
        Для контактных линз remoteRemains может не учитывать открытые упаковки.
        Этот endpoint принимает выгрузку remainGoodsReport (.csv/.xls/.xlsx) и возвращает packs/units/value
        плюс статистику открытых упаковок.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [report_file]
              properties:
                report_file:
                  type: string
                  format: binary
      responses:
        "200":
          description: Report summary
          content:
            application/json:
              schema:
                type: object

  /contactlenses/remainGoodsReport/analyze-csv:
    post:
      operationId: contactlensesRemainGoodsReportAnalyzeCsv
      summary: Точный остаток МКЛ из remainGoodsReport (CSV text in JSON)
      description: >
        GPT-friendly endpoint без multipart: передай CSV как строку report_csv.
        Возвращает packs/units/value и статистику открытых упаковок.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [report_csv]
              properties:
                report_csv:
                  type: string
      responses:
        "200":
          description: Report summary
          content:
            application/json:
              schema:
                type: object

  /contactlenses/remainGoodsReport/analyze-base64:
    post:
      operationId: contactlensesRemainGoodsReportAnalyzeBase64
      summary: Точный остаток МКЛ из remainGoodsReport (base64 file in JSON)
      description: >
        GPT-friendly endpoint без multipart: передай файл .xls/.xlsx/.csv в base64.
        Важно: укажи filename с правильным расширением.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [filename, file_base64]
              properties:
                filename:
                  type: string
                file_base64:
                  type: string
      responses:
        "200":
          description: Report summary
          content:
            application/json:
              schema:
                type: object

components:
  securitySchemes:
    OdlServerToken:
      type: apiKey
      in: header
      name: X-ODL-Token

  parameters:
    CategoryPath:
      name: category
      in: path
      required: true
      schema:
        type: string
        enum: [accessories, contactlenses, glasses, lenses, sunglasses]
    DepartmentId:
      name: department_id
      in: query
      required: false
      schema:
        type: integer
    DepartmentName:
      name: department_name
      in: query
      required: false
      schema:
        type: string
      description: Например Ленина, Качели, ТЦ Айсберг, Лермонтова.
    Group:
      name: group
      in: query
      required: false
      schema:
        type: string
      description: салоны, склады_ип, склады_ооо, цех.

  schemas:
    RemainsFilteredRequest:
      type: object
      required: [category]
      properties:
        category:
          type: string
          enum: [accessories, contactlenses, glasses, lenses, sunglasses]
        department_id:
          type: integer
        department_name:
          type: string
        group:
          type: string
        filters:
          type: object
          additionalProperties: true
        min_price:
          type: number
        max_price:
          type: number
        price:
          type: number
        return_items:
          type: boolean
          default: false
        items_limit:
          type: integer
          default: 0
          minimum: 0
          maximum: 1000

    SalesAnalyzeCsvRequest:
      type: object
      required: [sales_period_csv]
      properties:
        sales_period_csv:
          type: string
          description: >
            CSV content for sales_period.csv (UTF-8). Для категорийных продаж (например МКЛ)
            рекомендуемые канонические колонки: salon, category, revenue, qty_units, qty_packs.
            Русские заголовки тоже поддерживаются (например "выручка", "штук", "упаковки").
        plan_fact_csv:
          type: string
          nullable: true
          description: CSV content for plan_fact.csv (optional).
        employees_csv:
          type: string
          nullable: true
          description: CSV content for employees.csv (optional).
        categories_csv:
          type: string
          nullable: true
          description: >
            CSV content for categories.csv (optional). Для корректного расчета продаж используйте:
            revenue (выручка), qty_units (штуки), qty_packs (упаковки). category для МКЛ должен
            быть contactlenses / "контактные линзы" / "МКЛ".
        training_csv:
          type: string
          nullable: true
          description: CSV content for training.csv (optional).
