openapi: 3.1.0
info:
  title: ODL Sales Analyst MVP API
  version: "3.0.0"
  description: >
    MVP API для «Очкидалинзы»: ITigris remoteRemains используется только для
    остатков и товарной структуры, продажи анализируются из DataLens/Google
    Sheets/CSV input.
servers:
  - url: https://itigris-gpt-server.onrender.com

security:
  - OdlServerToken: []

paths:
  /healthz:
    get:
      operationId: healthCheck
      security: []
      summary: Проверить, что сервер жив
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object

  /departments:
    get:
      operationId: getDepartments
      summary: Список департаментов и алиасов
      responses:
        "200":
          description: Departments
          content:
            application/json:
              schema:
                type: object

  /categories:
    get:
      operationId: getCategories
      summary: Категории ITigris и допустимые фильтры
      responses:
        "200":
          description: Categories
          content:
            application/json:
              schema:
                type: object

  /remains-filtered:
    post:
      operationId: remainsFiltered
      summary: Остатки ITigris remoteRemains с фильтрами
      description: >
        Возвращает остатки, количество и стоимость. Это не продажи.
        Для МКЛ используйте category=contactlenses и фильтры manufacturer,
        name, color, radius, diameter, dioptre, cylinder, axis, add,
        wearingPeriod, inPack.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RemainsFilteredRequest"
      responses:
        "200":
          description: Remains summary
          content:
            application/json:
              schema:
                type: object
                description: >
                  Для category=contactlenses в summary дополнительно возвращаются:
                  total_qty_packs, total_qty_units и open_packs_detected.

  /count-by-filters:
    post:
      operationId: countByFilters
      summary: Посчитать остатки по категории, группе/салону и фильтрам
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RemainsFilteredRequest"
      responses:
        "200":
          description: Count summary
          content:
            application/json:
              schema:
                type: object

  /count-by-price/{category}:
    get:
      operationId: countByPrice
      summary: Посчитать остатки по ценовому диапазону
      parameters:
        - $ref: "#/components/parameters/CategoryPath"
        - $ref: "#/components/parameters/DepartmentId"
        - $ref: "#/components/parameters/DepartmentName"
        - $ref: "#/components/parameters/Group"
        - name: min_price
          in: query
          schema:
            type: number
        - name: max_price
          in: query
          schema:
            type: number
        - name: limit_items
          in: query
          schema:
            type: integer
            default: 50
            minimum: 0
            maximum: 500
      responses:
        "200":
          description: Count by price
          content:
            application/json:
              schema:
                type: object

  /count/{category}:
    get:
      operationId: countCategory
      summary: Посчитать все остатки категории
      parameters:
        - $ref: "#/components/parameters/CategoryPath"
        - $ref: "#/components/parameters/DepartmentId"
        - $ref: "#/components/parameters/DepartmentName"
        - $ref: "#/components/parameters/Group"
      responses:
        "200":
          description: Category count
          content:
            application/json:
              schema:
                type: object

  /breakdown/{category}:
    get:
      operationId: breakdownCategory
      summary: Структура остатков по полям категории
      parameters:
        - $ref: "#/components/parameters/CategoryPath"
        - $ref: "#/components/parameters/DepartmentId"
        - $ref: "#/components/parameters/DepartmentName"
        - $ref: "#/components/parameters/Group"
      responses:
        "200":
          description: Breakdown
          content:
            application/json:
              schema:
                type: object

  /gpt/breakdown/{category}:
    get:
      operationId: gptBreakdown
      summary: Компактная структура остатков для GPT Actions
      parameters:
        - $ref: "#/components/parameters/CategoryPath"
        - $ref: "#/components/parameters/DepartmentId"
        - $ref: "#/components/parameters/DepartmentName"
        - $ref: "#/components/parameters/Group"
        - name: top_n
          in: query
          schema:
            type: integer
            default: 10
            minimum: 1
            maximum: 30
      responses:
        "200":
          description: GPT compact breakdown
          content:
            application/json:
              schema:
                type: object

  /sales/analyze:
    post:
      operationId: salesAnalyze
      summary: Сформировать MVP weekly output по продажам
      description: >
        Принимает JSON dataset или использует data/input на сервере. Output
        возвращается в markdown с сигналами, проблемами, гипотезами и фокусом
        для Коммерческого директора и Тренеров.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                data:
                  type: object
                  additionalProperties:
                    type: array
                    items:
                      type: object
      responses:
        "200":
          description: Markdown report
          content:
            application/json:
              schema:
                type: object
                properties:
                  report_markdown:
                    type: string
                  data_sources:
                    type: object

  /sales/analyze-upload:
    post:
      operationId: salesAnalyzeUpload
      summary: Сформировать weekly output из CSV файлов (upload)
      description: >
        Загрузи sales_period.csv обязательно, остальные файлы опционально.
        Endpoint возвращает report_markdown (markdown) и счетчики строк по источникам.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [sales_period]
              properties:
                sales_period:
                  type: string
                  format: binary
                plan_fact:
                  type: string
                  format: binary
                employees:
                  type: string
                  format: binary
                categories:
                  type: string
                  format: binary
                training:
                  type: string
                  format: binary
      responses:
        "200":
          description: Markdown report
          content:
            application/json:
              schema:
                type: object
                properties:
                  report_markdown:
                    type: string
                  data_sources:
                    type: object

  /sales/analyze-csv:
    post:
      operationId: salesAnalyzeCsv
      summary: Сформировать weekly output из CSV текста (JSON)
      description: >
        Подходит для GPT Actions: передай содержимое CSV как строки в JSON.
        Обязателен только sales_period_csv, остальные поля опциональны.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SalesAnalyzeCsvRequest"
      responses:
        "200":
          description: Markdown report
          content:
            application/json:
              schema:
                type: object
                properties:
                  report_markdown:
                    type: string
                  data_sources:
                    type: object

  /contactlenses/remainGoodsReport/analyze:
    post:
      operationId: contactlensesRemainGoodsReportAnalyze
      summary: Точный остаток МКЛ из remainGoodsReport (CSV/XLSX upload)
      description: >
        Для контактных линз remoteRemains может не учитывать открытые упаковки.
        Этот endpoint принимает выгрузку remainGoodsReport (.csv/.xls/.xlsx) и возвращает packs/units/value
        плюс статистику открытых упаковок.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [report_file]
              properties:
                report_file:
                  type: string
                  format: binary
      responses:
        "200":
          description: Report summary
          content:
            application/json:
              schema:
                type: object

  /contactlenses/remainGoodsReport/analyze-csv:
    post:
      operationId: contactlensesRemainGoodsReportAnalyzeCsv
      summary: Точный остаток МКЛ из remainGoodsReport (CSV text in JSON)
      description: >
        GPT-friendly endpoint без multipart: передай CSV как строку report_csv.
        Возвращает packs/units/value и статистику открытых упаковок.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [report_csv]
              properties:
                report_csv:
                  type: string
      responses:
        "200":
          description: Report summary
          content:
            application/json:
              schema:
                type: object

  /contactlenses/remainGoodsReport/analyze-base64:
    post:
      operationId: contactlensesRemainGoodsReportAnalyzeBase64
      summary: Точный остаток МКЛ из remainGoodsReport (base64 file in JSON)
      description: >
        GPT-friendly endpoint без multipart: передай файл .xls/.xlsx/.csv в base64.
        Важно: укажи filename с правильным расширением.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [filename, file_base64]
              properties:
                filename:
                  type: string
                file_base64:
                  type: string
      responses:
        "200":
          description: Report summary
          content:
            application/json:
              schema:
                type: object

  /contactlenses/remainGoodsReport/snapshot/set:
    post:
      operationId: contactlensesRemainGoodsReportSnapshotSet
      summary: Загрузить remainGoodsReport один раз и сохранить как snapshot
      description: >
        MVP-механизм: загрузить актуальный remainGoodsReport для департамента 1 раз,
        сохранить в памяти сервера как truth snapshot и дальше отвечать без повторной
        вставки CSV. Snapshot живет ограниченное время (TTL).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [department_name, filename, file_base64]
              properties:
                department_name:
                  type: string
                filename:
                  type: string
                file_base64:
                  type: string
      responses:
        "200":
          description: Snapshot saved
          content:
            application/json:
              schema:
                type: object

  /contactlenses/remainGoodsReport/snapshot/set-global:
    post:
      operationId: contactlensesRemainGoodsReportSnapshotSetGlobal
      summary: Загрузить общий remainGoodsReport и сохранить snapshot по всем департаментам
      description: >
        MVP-механизм: загрузить один общий отчет remainGoodsReport (несколько департаментов),
        сервер сохранит итоги по каждому департаменту. Далее /contactlenses/stock/{department_name}
        будет отвечать из этого snapshot.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [filename, file_base64]
              properties:
                filename:
                  type: string
                file_base64:
                  type: string
      responses:
        "200":
          description: Snapshot saved
          content:
            application/json:
              schema:
                type: object

  /contactlenses/remainGoodsReport/snapshot:
    get:
      operationId: contactlensesRemainGoodsReportSnapshotGet
      summary: Прочитать текущий global snapshot remainGoodsReport (rows + summary)
      description: >
        Source of truth для МКЛ после авто-refresh или загрузки snapshot.
        Возвращает распарсенные строки (rows), список департаментов, totals/summary и метаданные (filename/ttl).
      parameters:
        - name: report_type
          in: query
          required: false
          schema:
            type: string
          description: >
            Тип товара (reportType). Например: Контактные линзы, Оправы, Солнцезащитные очки, Линзы, Аксессуары.
            Если не задан — используется default snapshot (Контактные линзы).
        - name: include_rows
          in: query
          required: false
          schema:
            type: boolean
            default: true
          description: Если false — вернуть только summary/metadata без массива rows.
      responses:
        "200":
          description: Snapshot
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  filename:
                    type: string
                  stored_at_unix:
                    type: integer
                  expires_at_unix:
                    type: integer
                  departments:
                    type: array
                    items:
                      type: string
                  departments_count:
                    type: integer
                  rows_count:
                    type: integer
                  overall_summary:
                    type: object
                    additionalProperties: true
                  rows:
                    type: array
                    items:
                      type: object
                      additionalProperties: true

  /contactlenses/remainGoodsReport/snapshot/search:
    get:
      operationId: contactlensesRemainGoodsReportSnapshotSearch
      summary: Поиск по строкам snapshot remainGoodsReport (детальные вопросы по товарке)
      description: >
        Используйте ЭТОТ endpoint первым для вопросов вида "сколько [бренд/model/design] в [департамент]".
        Не используйте remoteRemains/list или count_by_filters для детальных товарных вопросов, если есть snapshot.
        Возвращает matched_rows_count и totals (qty_units/qty_packs/value) по найденным строкам.
      parameters:
        - name: report_type
          in: query
          required: false
          schema:
            type: string
          description: Тип товара (reportType).
        - name: department_name
          in: query
          required: false
          schema:
            type: string
          description: Департамент (например "Ленина, 7"). Разрешены алиасы, будет best-effort match.
        - name: brand
          in: query
          required: false
          schema:
            type: string
          description: Бренд (contains match, case-insensitive).
        - name: manufacturer
          in: query
          required: false
          schema:
            type: string
          description: Производитель (contains match, case-insensitive).
        - name: product_name
          in: query
          required: false
          schema:
            type: string
          description: Наименование/товар (contains match, case-insensitive).
        - name: model
          in: query
          required: false
          schema:
            type: string
          description: Модель (contains match, case-insensitive).
        - name: design
          in: query
          required: false
          schema:
            type: string
          description: Дизайн (contains match, case-insensitive).
        - name: category
          in: query
          required: false
          schema:
            type: string
          description: Категория/тип (contains match, case-insensitive).
        - name: query
          in: query
          required: false
          schema:
            type: string
          description: Общий поисковый текст по полям строки (brand/model/name/raw_text).
        - name: include_rows
          in: query
          required: false
          schema:
            type: boolean
            default: false
          description: Если true — вернуть массив rows (может быть большим).
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 200
            minimum: 1
            maximum: 2000
          description: Максимум возвращаемых строк (и учитываемых в totals).
      responses:
        "200":
          description: Search result
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  source:
                    type: string
                  report_type:
                    type: string
                  matched_rows_count:
                    type: integer
                  total_qty_units:
                    type: integer
                  total_qty_packs:
                    type: integer
                  total_value:
                    type: number
                  rows:
                    type: array
                    items:
                      type: object
                      additionalProperties: true

  /contactlenses/remainGoodsReport/auto/status:
    get:
      operationId: contactlensesRemainGoodsReportAutoStatus
      summary: Статус авто-подтягивания remainGoodsReport из ITigris
      description: >
        Показывает, настроен ли авто-fetch (Render env `ITIGRIS_REMAINGOODSREPORT_URL_TEMPLATE`),
        и есть ли сейчас global snapshot.
      responses:
        "200":
          description: Status
          content:
            application/json:
              schema:
                type: object

  /contactlenses/remainGoodsReport/auto/refresh:
    post:
      operationId: contactlensesRemainGoodsReportAutoRefresh
      summary: Обновить global snapshot remainGoodsReport из ITigris (без ручной загрузки)
      description: >
        Сервер попробует получить актуальный remainGoodsReport автоматически и обновить global snapshot.
        Источники:
        1) `ITIGRIS_REMAINGOODSREPORT_URL_TEMPLATE` (прямая загрузка файла)
        2) web session cookie + reportPage (env `ITIGRIS_REMAINGOODSREPORT_WEB_*`)
      parameters:
        - name: force
          in: query
          required: false
          schema:
            type: boolean
            default: false
        - name: report_type
          in: query
          required: false
          schema:
            type: string
          description: >
            Тип товара (reportType). Если задан — обновляется snapshot именно для этого типа товара.
      responses:
        "200":
          description: Snapshot refreshed
          content:
            application/json:
              schema:
                type: object

  /contactlenses/stock/{department_name}:
    get:
      operationId: contactlensesStock
      summary: Остаток МКЛ по департаменту (snapshot truth, fallback API)
      description: >
        Порядок источников в режиме `source=auto`:
        1) если настроен авто-fetch remainGoodsReport (см. /contactlenses/remainGoodsReport/auto/*) — best-effort обновит global snapshot;
        2) если есть global/per-department snapshot remainGoodsReport — вернет точный packs/units/value;
        3) иначе вернет remoteRemains snapshot (approximate) и предупреждение.
      parameters:
        - name: department_name
          in: path
          required: true
          schema:
            type: string
        - name: source
          in: query
          required: false
          schema:
            type: string
            enum: [auto, snapshot, api]
            default: auto
      responses:
        "200":
          description: Stock result
          content:
            application/json:
              schema:
                type: object

components:
  securitySchemes:
    OdlServerToken:
      type: apiKey
      in: header
      name: X-ODL-Token

  parameters:
    CategoryPath:
      name: category
      in: path
      required: true
      schema:
        type: string
        enum: [accessories, contactlenses, glasses, lenses, sunglasses]
    DepartmentId:
      name: department_id
      in: query
      required: false
      schema:
        type: integer
    DepartmentName:
      name: department_name
      in: query
      required: false
      schema:
        type: string
      description: Например Ленина, Качели, ТЦ Айсберг, Лермонтова.
    Group:
      name: group
      in: query
      required: false
      schema:
        type: string
      description: салоны, склады_ип, склады_ооо, цех.

  schemas:
    RemainsFilteredRequest:
      type: object
      required: [category]
      properties:
        category:
          type: string
          enum: [accessories, contactlenses, glasses, lenses, sunglasses]
        department_id:
          type: integer
        department_name:
          type: string
        group:
          type: string
        filters:
          type: object
          additionalProperties: true
        min_price:
          type: number
        max_price:
          type: number
        price:
          type: number
        return_items:
          type: boolean
          default: false
        items_limit:
          type: integer
          default: 0
          minimum: 0
          maximum: 1000

    SalesAnalyzeCsvRequest:
      type: object
      required: [sales_period_csv]
      properties:
        sales_period_csv:
          type: string
          description: >
            CSV content for sales_period.csv (UTF-8). Для категорийных продаж (например МКЛ)
            рекомендуемые канонические колонки: salon, category, revenue, qty_units, qty_packs.
            Русские заголовки тоже поддерживаются (например "выручка", "штук", "упаковки").
        plan_fact_csv:
          type: string
          nullable: true
          description: CSV content for plan_fact.csv (optional).
        employees_csv:
          type: string
          nullable: true
          description: CSV content for employees.csv (optional).
        categories_csv:
          type: string
          nullable: true
          description: >
            CSV content for categories.csv (optional). Для корректного расчета продаж используйте:
            revenue (выручка), qty_units (штуки), qty_packs (упаковки). category для МКЛ должен
            быть contactlenses / "контактные линзы" / "МКЛ".
        training_csv:
          type: string
          nullable: true
          description: CSV content for training.csv (optional).
